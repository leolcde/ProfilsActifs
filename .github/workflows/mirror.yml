name: Production build check + mirror

on:
  push:
    branches: [production]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go build ./...
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: frontend

  mirror:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Clé SSH d'un compte qui a un accès WRITE au repo cible (ton compte perso).
      # Ce N'EST PAS une deploy key : pas besoin des settings du repo cible.
      # Secret MIRROR_SSH_KEY = clé privée ed25519 complète (avec newline finale).
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_KEY }}

      - name: Push copy vers le repo miroir
        env:
          # Variable : ex EpitechPGE3-2026/G-SVR-500-STG-5-1-survivor-7
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
        run: |
          git push --force "git@github.com:${MIRROR_REPO}.git" production:production

